name: build

on:
  push:
    branches: [main]
  pull_request:

jobs:
  macos-arm64:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Cache JUCE
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: build/_deps
          key: juce-91ad83ae34a81e0833b1a2b0866f54846370ae53
      - name: Verify factory bank
        run: python3 scripts/generate-presets.py --check
      - name: Configure
        # Same generator as BUILDING.md; the Xcode generator adds entitlement/codesign steps that
        # are not part of the documented build and were the only difference to passing local runs.
        run: cmake -S . -B build -G "Unix Makefiles" -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build --target SubLab808Tests SubLab808_VST3 SubLab808HostTests SubLab808PresetTests -j "$(sysctl -n hw.ncpu)"
      - name: Test
        run: ctest --test-dir build --output-on-failure
      - name: Verify deployment target and architecture
        run: |
          binary="build/SubLab808_artefacts/Release/VST3/SubLab808.vst3/Contents/MacOS/SubLab808"
          test "$(lipo -archs "$binary")" = "arm64"
          otool -l "$binary" | grep -A3 LC_BUILD_VERSION | grep "minos 11.0"
      - name: Package and validate downloadable bundle
        run: |
          bundle="build/SubLab808_artefacts/Release/VST3/SubLab808.vst3"
          archive="build/SubLab808-VST3.zip"
          ditto -c -k --keepParent "$bundle" "$archive"
          mkdir -p build/artifact-roundtrip
          ditto -x -k "$archive" build/artifact-roundtrip
          restored="build/artifact-roundtrip/SubLab808.vst3"
          test -x "$restored/Contents/MacOS/SubLab808"
          codesign --verify --deep --strict "$restored"
          build/SubLab808HostTests_artefacts/Release/SubLab808HostTests "$restored"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: SubLab808-VST3-${{ github.sha }}
          path: build/SubLab808-VST3.zip

  sanitizers:
    name: ASan + UBSan (tests and host test)
    runs-on: macos-14
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Cache JUCE
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: build-asan/_deps
          key: juce-91ad83ae34a81e0833b1a2b0866f54846370ae53
      - name: Verify factory bank
        run: python3 scripts/generate-presets.py --check
      - name: Configure
        run: >
          cmake -S . -B build-asan -G "Unix Makefiles" -DCMAKE_BUILD_TYPE=RelWithDebInfo
          -DCMAKE_C_FLAGS="-fsanitize=address,undefined"
          -DCMAKE_CXX_FLAGS="-fsanitize=address,undefined -fno-omit-frame-pointer -fno-sanitize-recover=undefined"
          -DCMAKE_EXE_LINKER_FLAGS="-fsanitize=address,undefined"
          -DCMAKE_SHARED_LINKER_FLAGS="-fsanitize=address,undefined"
          -DCMAKE_MODULE_LINKER_FLAGS="-fsanitize=address,undefined"
      - name: Build
        run: cmake --build build-asan --target SubLab808Tests SubLab808_VST3 SubLab808HostTests SubLab808PresetTests -j "$(sysctl -n hw.ncpu)"
      - name: Test
        env:
          ASAN_OPTIONS: detect_leaks=0
          UBSAN_OPTIONS: print_stacktrace=1
        run: ctest --test-dir build-asan --output-on-failure
