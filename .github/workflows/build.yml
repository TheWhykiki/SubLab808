name: build

on:
  push:
    branches: [main]
  pull_request:

jobs:
  macos-arm64:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Cache JUCE
        uses: actions/cache@v4
        with:
          path: build/_deps
          key: juce-91ad83ae34a81e0833b1a2b0866f54846370ae53
      - name: Configure
        # Same generator as BUILDING.md; the Xcode generator adds entitlement/codesign steps that
        # are not part of the documented build and were the only difference to passing local runs.
        run: cmake -S . -B build -G "Unix Makefiles" -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build --target SubLab808Tests SubLab808_VST3 SubLab808HostTests -j "$(sysctl -n hw.ncpu)"
      - name: Test
        run: ctest --test-dir build --output-on-failure
      - name: Verify deployment target and architecture
        run: |
          binary="build/SubLab808_artefacts/Release/VST3/SubLab808.vst3/Contents/MacOS/SubLab808"
          lipo -archs "$binary"
          otool -l "$binary" | grep -A3 LC_BUILD_VERSION | grep "minos 11.0"
      - uses: actions/upload-artifact@v4
        with:
          name: SubLab808-VST3-${{ github.sha }}
          path: build/SubLab808_artefacts/Release/VST3/SubLab808.vst3

  sanitizers:
    name: ASan + UBSan (tests and host test)
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Cache JUCE
        uses: actions/cache@v4
        with:
          path: build-asan/_deps
          key: juce-91ad83ae34a81e0833b1a2b0866f54846370ae53
      - name: Configure
        run: >
          cmake -S . -B build-asan -G "Unix Makefiles" -DCMAKE_BUILD_TYPE=RelWithDebInfo
          -DCMAKE_C_FLAGS="-fsanitize=address,undefined"
          -DCMAKE_CXX_FLAGS="-fsanitize=address,undefined -fno-omit-frame-pointer -fno-sanitize-recover=undefined"
          -DCMAKE_EXE_LINKER_FLAGS="-fsanitize=address,undefined"
          -DCMAKE_SHARED_LINKER_FLAGS="-fsanitize=address,undefined"
          -DCMAKE_MODULE_LINKER_FLAGS="-fsanitize=address,undefined"
      - name: Build
        run: cmake --build build-asan --target SubLab808Tests SubLab808_VST3 SubLab808HostTests -j "$(sysctl -n hw.ncpu)"
      - name: Test
        env:
          ASAN_OPTIONS: detect_leaks=0
          UBSAN_OPTIONS: print_stacktrace=1
        run: ctest --test-dir build-asan --output-on-failure
